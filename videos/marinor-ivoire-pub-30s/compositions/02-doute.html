            <path d="M40 130 l3 2 M70 150 l2 3 M110 136 l3 1 M150 160 l2 2 M200 140 l3 2 M230 170 l2 3 M60 210 l3 1 M120 230 l2 3 M180 220 l3 2 M90 262 l2 2 M210 258 l3 1" stroke="#6b5530" stroke-width="2.4" stroke-linecap="round" opacity="0.55" />
            <path d="M22 118 C70 106 120 124 160 112 C200 102 236 116 258 110" stroke="#f8edc8" stroke-width="2.5" fill="none" opacity="0.7" />
            <!-- glass sheen -->
            <path d="M44 52 L236 52 L236 62 C252 68 260 80 260 100 L260 252 C260 274 246 288 222 288 L58 288 C34 288 20 274 20 252 L20 100 C20 80 28 68 44 62 Z" fill="url(#f02-doute-g-glass)" />
            <rect x="34" y="96" width="14" height="170" rx="7" fill="#ffffff" opacity="0.45" filter="url(#f02-doute-fspec)" />
            <rect x="38" y="100" width="5" height="120" rx="2.5" fill="#ffffff" opacity="0.6" />
            <rect x="236" y="110" width="8" height="140" rx="4" fill="#ffffff" opacity="0.28" filter="url(#f02-doute-fsoft)" />
            <!-- lid -->
            <rect x="30" y="4" width="220" height="52" rx="11" fill="url(#f02-doute-g-lid)" />
            <path d="M46 12 L46 50 M62 12 L62 50 M78 12 L78 50 M94 12 L94 50 M110 12 L110 50 M126 12 L126 50 M142 12 L142 50 M158 12 L158 50 M174 12 L174 50 M190 12 L190 50 M206 12 L206 50 M222 12 L222 50 M238 12 L238 50" stroke="#5e454c" stroke-width="2" opacity="0.32" />
            <rect x="30" y="4" width="220" height="10" rx="5" fill="#ffffff" opacity="0.35" />
          </svg>
          <div class="dou-label" style="left:15px;top:121px;width:250px;height:62px">Conservateurs</div>
        </div>
      </div>
    </div>

    <!-- ===== Track 2: crumble dust ===== -->
    <div id="f02-doute-crumbs" class="clip dou-layer dou-crumbs" data-start="0" data-duration="4" data-track-index="2"></div>

    <!-- ===== Track 3: the gold strike ===== -->
    <div id="f02-doute-strike" class="clip dou-layer dou-strike" data-start="0" data-duration="4" data-track-index="3">
      <svg viewBox="0 0 1920 1080" aria-hidden="true">
        <defs>
          <linearGradient id="f02-doute-g-stroke" gradientUnits="userSpaceOnUse" x1="295" y1="0" x2="1625" y2="0">
            <stop offset="0" stop-color="#f9a825" />
            <stop offset="0.85" stop-color="#fbd021" />
          </linearGradient>
        </defs>
        <path id="f02-doute-strike-main" d="M1625 733 L295 773" pathLength="100" stroke="url(#f02-doute-g-stroke)" stroke-width="18" stroke-linecap="round" fill="none" />
        <path id="f02-doute-strike-dry" d="M1596 745 C1200 755 800 767 330 783" pathLength="100" stroke="#fbd021" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75" />
      </svg>
    </div>

    <!-- ===== Track 4: the question ===== -->
    <div id="f02-doute-text" class="clip dou-layer dou-text" data-start="0" data-duration="4" data-track-index="4">
      <div class="dou-question" id="f02-doute-question">
        <div class="dou-qline"><span class="dou-w" data-g="0">Sans</span> <span class="dou-w" data-g="0">additifs</span> <span class="dou-w" data-g="1">ni</span> <span class="dou-w" data-g="1">substances</span> <span class="dou-w" data-g="1">douteuses</span></div>
        <div class="dou-qline"><span class="dou-w" data-g="2">pour</span> <span class="dou-w dou-w-sun" data-g="2">votre</span> <span class="dou-w dou-w-sun" data-g="2">santé</span>&nbsp;<span class="dou-w" data-g="2">?</span></div>
      </div>
    </div>

    <!-- ===== Track 5: seam A in (full-frame #2a070d) ===== -->
    <div id="f02-doute-entry" class="clip dou-layer dou-entry" data-start="0" data-duration="4" data-track-index="5"></div>

    <!-- ===== Track 6: seam B out — the gold band (exit state: full-frame gold gradient) ===== -->
    <div id="f02-doute-band" class="clip dou-layer dou-band" data-start="0" data-duration="4" data-track-index="6"></div>
  </div>

  <script src="../assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById("f02-doute-" + id);
      const tl = gsap.timeline({ paused: true });

      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const prand = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      const mix = (a, b, k) => "rgb(" + Math.round(a[0] + (b[0] - a[0]) * k) + "," + Math.round(a[1] + (b[1] - a[1]) * k) + "," + Math.round(a[2] + (b[2] - a[2]) * k) + ")";
      const eIn2 = gsap.parseEase("power2.in");
      const eOut2 = gsap.parseEase("power2.out");
      const eInOut2 = gsap.parseEase("power2.inOut");
      const eStrike = gsap.parseEase("power3.inOut");

      // ---------- Scene 1 — seam A in: full-frame #2a070d lifts ----------
      tl.fromTo($("entry"), { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power1.out" }, 0);

      // ---------- Scene 2 — the three containers drop in a row (centre-bottom) ----------
      const CONTAINERS = [
        { key: "cube", cx: 540, top: 650, w: 240, h: 250, drop: 0.3, tint: ["#dccacd", "#ad949a", "#7b1421", "#5a2a1c", "#f6e8ea"] },
        { key: "bottle", cx: 960, top: 570, w: 250, h: 330, drop: 0.42, tint: ["#a8642f", "#5a2a16", "#7b1421", "#d18e4e", "#8a4b2a"] },
        { key: "jar", cx: 1380, top: 610, w: 280, h: 290, drop: 0.54, tint: ["#e9d9a6", "#b59ba1", "#7b1421", "#5a2a1c", "#cdb77c"] },
      ];
      CONTAINERS.forEach((c) => {
        const box = $("box-" + c.key);
        const body = $("body-" + c.key);
        const sh = $("sh-" + c.key);
        // falls from fully above the frame (bottom edge starts 40 px above the top of the canvas)
        tl.fromTo(box, { y: -(c.top + c.h + 40), opacity: 1 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.25)", immediateRender: true }, c.drop);
        tl.fromTo(sh, { opacity: 0, scaleX: 0.35 }, { opacity: 1, scaleX: 1, duration: 0.42, ease: "power2.in" }, c.drop);
        // landing squash & recover
        tl.fromTo(body, { scaleY: 1, scaleX: 1 }, { scaleY: 0.93, scaleX: 1.05, duration: 0.09, ease: "power2.out" }, c.drop + 0.3);
        tl.to(body, { scaleY: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, c.drop + 0.39);
      });

      // ---------- alert halo: slow breath + two pulses (0,9 s and 1,9 s) ----------
      const halo = $("halo");
      tl.fromTo(halo, { opacity: 0.2, scale: 0.92 }, { opacity: 0.38, scale: 1, duration: 0.6, ease: "power2.out" }, 0.25);
      [0.9, 1.9].forEach((at) => {
        tl.to(halo, { opacity: 1, scale: 1.14, duration: 0.2, ease: "power2.out" }, at);
        tl.to(halo, { opacity: 0.38, scale: 1, duration: 0.6, ease: "power2.inOut" }, at + 0.2);
      });

      // ---------- Scene 3 — the question, by word group on the voice ----------
      const GROUP_AT = [0.35, 1.27, 2.6];
      const groupIdx = [0, 0, 0];
      Array.prototype.forEach.call($("question").querySelectorAll(".dou-w"), (w) => {
        const g = Number(w.dataset.g);
        const at = GROUP_AT[g] + groupIdx[g] * 0.07;
        groupIdx[g]++;
        tl.fromTo(w, { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, at);
      });

      // ---------- Scene 4 — the gold strike, one gesture to the left ----------
      const STRIKE_AT = 2.52, STRIKE_DUR = 0.4;
      tl.fromTo($("strike-main"), { strokeDasharray: 100, strokeDashoffset: 100, opacity: 1 }, { strokeDashoffset: 0, duration: STRIKE_DUR, ease: "power3.inOut" }, STRIKE_AT);
      tl.fromTo($("strike-dry"), { strokeDasharray: 100, strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: STRIKE_DUR, ease: "power3.inOut" }, STRIKE_AT + 0.04);
      // when does the brush tip pass each label?  (inverse of the strike ease, solved once at build time)
      const passAt = (x) => {
        const frac = (1625 - x) / (1625 - 295);
        let lo = 0, hi = 1;
        for (let k = 0; k < 30; k++) {
          const m = (lo + hi) / 2;
          if (eStrike(m) < frac) lo = m;
          else hi = m;
        }
        return STRIKE_AT + lo * STRIKE_DUR;
      };

      // ---------- Scene 5 — the containers crumble to dust that turns to gold ----------
      const crumbHost = $("crumbs");
      const GOLDS = [hex("#f9a825"), hex("#fbd021"), hex("#f9a825")];
      const crumbs = [];
      const STAGE_S = 1.14;
      CONTAINERS.forEach((c, ci) => {
        c.crumbleAt = Math.max(2.75, passAt(960 + (c.cx - 960) * STAGE_S) + 0.05);
        const body = $("body-" + c.key);
        const box = $("box-" + c.key);
        const sh = $("sh-" + c.key);
        // erodes top-down into the dust while collapsing to the floor (scale → 0 + opacity)
        tl.fromTo(body, { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(100% 0% 0% 0%)", duration: 0.36, ease: "power1.in" }, c.crumbleAt);
        tl.to(body, { scaleX: 0.2, scaleY: 0, duration: 0.36, ease: "power2.in" }, c.crumbleAt + 0.02);
        tl.to(box, { opacity: 0, duration: 0.22, ease: "power1.in" }, c.crumbleAt + 0.14);
        tl.to(sh, { opacity: 0, scaleX: 0.3, duration: 0.36, ease: "power2.in" }, c.crumbleAt);
        const N = 54;
        for (let i = 0; i < N; i++) {
          const seed = ci * 1000 + i;
          const el = document.createElement("div");
          el.className = "dou-crumb";
          const sz = 5 + prand(seed * 3 + 1) * 10;
          el.style.width = sz + "px";
          el.style.height = sz * (0.6 + prand(seed * 5 + 2) * 0.6) + "px";
          el.style.borderRadius = prand(seed * 7 + 3) > 0.5 ? "50%" : "2px";
          crumbHost.appendChild(el);
          const lx = c.cx + (prand(seed * 11 + 4) - 0.5) * c.w * 0.85;
          const ly = c.top + 20 + prand(seed * 13 + 5) * (c.h - 30);
          const ox = 960 + (lx - 960) * STAGE_S; // stage layer is scaled about (960, 900)
          const oy = 900 + (ly - 900) * STAGE_S;
          const fromTop = (ly - c.top) / c.h; // upper particles go first: the container erodes top-down
          crumbs.push({
            el: el,
            ox: ox,
            oy: oy,
            vx: (lx - c.cx) * 1.8 + (prand(seed * 17 + 6) - 0.5) * 170,
            vy: -(60 + prand(seed * 19 + 7) * 260),
            spin: (prand(seed * 23 + 8) - 0.5) * 900,
            birth: c.crumbleAt + fromTop * 0.3 + prand(seed * 29 + 9) * 0.05,
            life: 0.62 + prand(seed * 31 + 10) * 0.3,
            c0: hex(c.tint[i % c.tint.length]),
            c1: GOLDS[i % GOLDS.length],
          });
        }
      });

      // ---------- background motes (slow, anxious drift) ----------
      const moteHost = $("motes");
      const motes = [];
      for (let i = 0; i < 14; i++) {
        const el = document.createElement("div");
        el.className = "dou-mote";
        const sz = 4 + prand(i * 37 + 2) * 10;
        el.style.width = el.style.height = sz + "px";
        if (prand(i * 41 + 3) > 0.5) el.style.filter = "blur(" + (1 + prand(i * 43 + 4) * 2.5).toFixed(2) + "px)";
        moteHost.appendChild(el);
        motes.push({
          el: el,
          x0: 160 + prand(i * 47 + 5) * 1600,
          y0: 120 + prand(i * 53 + 6) * 840,
          ax: 12 + prand(i * 59 + 7) * 20,
          fall: 8 + prand(i * 61 + 8) * 14,
          w: 0.5 + prand(i * 67 + 9) * 0.7,
          ph: prand(i * 71 + 10) * Math.PI * 2,
          op: 0.25 + prand(i * 73 + 11) * 0.45,
        });
      }

      // ---------- Scene 6 — seam B: the strike thickens into a 115° gold band sweeping left ----------
      const band = $("band");
      const S0 = { x: 960, y: 753, len: Math.hypot(1330, 40), ang: Math.atan2(733 - 773, 1625 - 295) };
      const S1 = { x: 760, y: 548, len: 3000, ang: (-65 * Math.PI) / 180 };
      const BAND_AT = 3.45, BAND_DUR = 0.5;
      const bandPoly = (cx, cy, len, thick, ang) => {
        const ax = Math.cos(ang), ay = Math.sin(ang); // long axis
        const nx = -ay, ny = ax; // normal
        const hl = len / 2, ht = thick / 2;
        const pts = [];
        // rounded caps (6 steps each) so the thin start matches the round-capped brush
        for (let k = 0; k <= 6; k++) {
          const a = -Math.PI / 2 + (k / 6) * Math.PI;
          pts.push([cx + ax * (hl + Math.cos(a) * Math.min(ht, 9)) + nx * Math.sin(a) * ht, cy + ay * (hl + Math.cos(a) * Math.min(ht, 9)) + ny * Math.sin(a) * ht]);
        }
        for (let k = 0; k <= 6; k++) {
          const a = Math.PI / 2 + (k / 6) * Math.PI;
          pts.push([cx + ax * (-hl + Math.cos(a) * Math.min(ht, 9)) + nx * Math.sin(a) * ht, cy + ay * (-hl + Math.cos(a) * Math.min(ht, 9)) + ny * Math.sin(a) * ht]);
        }
        return "polygon(" + pts.map((p) => p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px").join(",") + ")";
      };

      // ---------- per-frame pure render (dust, motes, band) ----------
      const strikeSvgPaths = [$("strike-main"), $("strike-dry")];
      const render = (t) => {
        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          const x = m.x0 + Math.sin(t * m.w + m.ph) * m.ax;
          const y = m.y0 + t * m.fall + Math.cos(t * m.w * 0.7 + m.ph) * 8;
          m.el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
          m.el.style.opacity = (m.op * clamp01((t - 0.15) / 0.5)).toFixed(3);
        }
        for (let i = 0; i < crumbs.length; i++) {
          const p = crumbs[i];
          const a = t - p.birth;
          if (a <= 0 || a >= p.life) {
            p.el.style.opacity = "0";
            continue;
          }
          const k = a / p.life;
          const x = p.ox + p.vx * a;
          const y = p.oy + p.vy * a + 0.5 * 1500 * a * a;
          p.el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) rotate(" + (p.spin * a).toFixed(1) + "deg)";
          p.el.style.background = mix(p.c0, p.c1, clamp01(k * 1.35));
          p.el.style.opacity = (k < 0.65 ? 1 : 1 - (k - 0.65) / 0.35).toFixed(3);
        }
        // band
        const bu = clamp01((t - BAND_AT) / BAND_DUR);
        if (bu <= 0) {
          band.style.clipPath = "polygon(0px 0px, 0px 0px, 0px 0px)";
          strikeSvgPaths[0].style.visibility = strikeSvgPaths[1].style.visibility = "visible";
        } else if (t >= 3.95) {
          band.style.clipPath = "none";
          strikeSvgPaths[0].style.visibility = strikeSvgPaths[1].style.visibility = "hidden";
        } else {
          const r = eOut2(clamp01(bu / 0.6));
          const m = eInOut2(bu);
          const cx = S0.x + (S1.x - S0.x) * m;
          const cy = S0.y + (S1.y - S0.y) * m;
          const len = S0.len + (S1.len - S0.len) * eOut2(bu);
          const ang = S0.ang + (S1.ang - S0.ang) * r;
          const thick = 18 + (3300 - 18) * eIn2(bu);
          band.style.clipPath = bandPoly(cx, cy, len, thick, ang);
          strikeSvgPaths[0].style.visibility = strikeSvgPaths[1].style.visibility = "hidden";
        }
      };
      const drv = { t: 0 };
      tl.fromTo(drv, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(drv.t) }, 0);
      render(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-doute"] = tl;
    })();
  </script>
</template>
