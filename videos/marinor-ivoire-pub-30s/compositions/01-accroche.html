      <div class="acc-question" id="f01-accroche-question">
        <div class="acc-line" id="f01-accroche-line1"><span class="acc-w">Envie</span> <span class="acc-w">de</span> <span class="acc-gold" id="f01-accroche-gold"><span class="acc-w acc-w-gold">relever</span> <span class="acc-w acc-w-gold">le</span> <span class="acc-w acc-w-gold">goût</span><svg class="acc-trait" id="f01-accroche-trait" viewBox="0 0 720 40" preserveAspectRatio="none" aria-hidden="true"><path id="f01-accroche-trait-main" d="M10 22 C120 13 250 27 380 19 C500 12 610 22 708 14" pathLength="100" stroke="url(#f01-accroche-g-gold)" stroke-width="12" stroke-linecap="round" fill="none" /><path id="f01-accroche-trait-dry" d="M30 30 C150 23 270 33 400 27 C510 22 600 28 680 23" pathLength="100" stroke="#fbd021" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8" /></svg><span class="acc-pinch" id="f01-accroche-pinch"></span></span></div>

    <!-- ===== Track 3: seam A — the bordeaux iris (exit state: full frame #2a070d) ===== -->
    <div id="f01-accroche-iris" class="clip acc-layer acc-iris" data-start="0" data-duration="4" data-track-index="3"><div class="acc-iris-rim" id="f01-accroche-iris-rim"></div></div>

  <script src="../assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const ID = "01-accroche";
      const $ = (id) => document.getElementById("f" + ID + "-" + id);
      const tl = gsap.timeline({ paused: true });

      const stage = $("stage");
      const textLayer = $("text");
      const iris = $("iris");
      const qmark = $("qmark");

      // ---------- deterministic helpers ----------
      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const prand = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const eBurst = gsap.parseEase("back.out(1.45)");
      const ePop = gsap.parseEase("back.out(1.7)");
      const eOut3 = gsap.parseEase("power3.out");
      const eIn3 = gsap.parseEase("power3.in");
      const eIn2 = gsap.parseEase("power2.in");
      const eSine = gsap.parseEase("sine.inOut");
      const eDraw = gsap.parseEase("power2.inOut");

      // ---------- ring geometry: superellipse orbit (clears the 2-line question at every angle) ----------
      const RX = 742, RY = 322, NEXP = 4;
      const ring = (th) => {
        const c = Math.cos(th), s = Math.sin(th);
        const r = 1 / Math.pow(Math.pow(Math.abs(c) / RX, NEXP) + Math.pow(Math.abs(s) / RY, NEXP), 1 / NEXP);
        return { x: r * c, y: r * s, s: s, c: c };
      };
      const PERSP = 1800, ZAMP = 115;
      const ORBIT = (32 * Math.PI) / 180; // slow drift of the ring over 0.9–3.5 s

      // ---------- icons ----------
      const icons = Array.prototype.map.call(stage.querySelectorAll(".acc-icon"), (el, i) => {
        const size = Number(el.dataset.size);
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.marginLeft = -size / 2 + "px";
        el.style.marginTop = -size / 2 + "px";
        return {
          el: el,
          th0: (Number(el.dataset.angle) * Math.PI) / 180,
          s0: 0.06 + Number(el.dataset.order) * 0.06,
          ph: prand(i * 3 + 1) * Math.PI * 2,
          k: i,
          dq: 0,
        };
      });

      // shortest way round the ring from each icon's end-of-orbit angle to the angle of the « ? »
      icons.forEach((ic) => {
        const thQ = Math.atan2(588 - 540, 1561 - 960);
        let d = thQ - (ic.th0 + ORBIT);
        while (d > Math.PI) d -= Math.PI * 2;
        while (d <= -Math.PI) d += Math.PI * 2;
        ic.dq = d;
      });

      // ---------- background spice specks ----------
      const speckHost = $("specks");
      const specks = [];
      for (let i = 0; i < 11; i++) {
        const d = document.createElement("div");
        d.className = "acc-speck";
        const sz = 5 + prand(i * 7 + 2) * 9;
        d.style.width = sz + "px";
        d.style.height = sz * (0.8 + prand(i * 5 + 9) * 0.3) + "px";
        if (prand(i * 13 + 4) > 0.55) d.style.filter = "blur(" + (1 + prand(i * 3 + 8) * 2).toFixed(2) + "px)";
        speckHost.appendChild(d);
        // spread on a loose ring, away from the text block
        const a = (i / 11) * Math.PI * 2 + prand(i * 11 + 1) * 0.5;
        const rr = 0.55 + prand(i * 17 + 3) * 0.45;
        specks.push({
          el: d,
          x0: 960 + Math.cos(a) * 880 * rr,
          y0: 540 + Math.sin(a) * 470 * rr,
          ax: 10 + prand(i * 19 + 5) * 16,
          rise: 10 + prand(i * 23 + 6) * 16,
          w: 0.6 + prand(i * 29 + 7) * 0.8,
          ph: prand(i * 31 + 8) * Math.PI * 2,
          op: 0.55 + prand(i * 37 + 9) * 0.4,
        });
      }

      // ---------- pinch of golden dust from the brush ----------
      const pinchHost = $("pinch");
      const dust = [];
      const DUST_N = 22;
      const DUST_COLORS = ["#f9a825", "#fbd021", "#e8901a", "#f9a825", "#ffe07a", "#d8860c", "#fbd021", "#ffffff"];
      for (let i = 0; i < DUST_N; i++) {
        const d = document.createElement("div");
        d.className = "acc-dust";
        const sz = 5.5 + prand(i * 41 + 3) * 7.5;
        d.style.width = sz + "px";
        d.style.height = sz + "px";
        d.style.marginLeft = -sz / 2 + "px";
        d.style.marginTop = -sz / 2 + "px";
        d.style.background = DUST_COLORS[i % DUST_COLORS.length];
        pinchHost.appendChild(d);
        dust.push({
          el: d,
          birth: 1.04 + (i / (DUST_N - 1)) * 0.4 + prand(i * 43 + 1) * 0.04,
          vx: (prand(i * 47 + 2) - 0.35) * 120,
          vy: -(40 + prand(i * 53 + 4) * 120),
          life: 0.8 + prand(i * 59 + 5) * 0.4,
        });
      }

      // ---------- fixed composition coordinates (measured once from the laid-out 92px question) ----------
      const QX = 1561, QY = 588; // centre of the « ? » glyph — origin of the suction and of the iris
      const GOLD_W = 692; // width of the « relever le goût » group carrying the brushstroke

      // trait timing (gold underline draws under « relever le goût »)
      const TRAIT_AT = 0.98, TRAIT_DUR = 0.45;

      // ---------- per-frame pure render of the ring, specks, dust and iris ----------
      const rim = $("iris-rim");
      const render = (t) => {
        // specks: slow drift
        const fade = clamp01(t / 0.6);
        for (let i = 0; i < specks.length; i++) {
          const p = specks[i];
          const x = p.x0 + Math.sin(t * p.w + p.ph) * p.ax;
          const y = p.y0 - t * p.rise + Math.cos(t * p.w * 0.8 + p.ph) * 6;
          p.el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
          p.el.style.opacity = (p.op * fade).toFixed(3);
        }

        // golden pinch — ballistic, pure function of t
        for (let i = 0; i < dust.length; i++) {
          const p = dust[i];
          const a = t - p.birth;
          if (a <= 0 || a >= p.life) {
            p.el.style.opacity = "0";
            continue;
          }
          const tip = eDraw(clamp01((p.birth - TRAIT_AT) / TRAIT_DUR));
          const x0 = GOLD_W * (-0.02 + 1.04 * tip);
          const x = x0 + p.vx * a;
          const y = -6 + p.vy * a + 0.5 * 900 * a * a;
          const lf = a / p.life;
          const sc = lf < 0.15 ? 0.4 + (lf / 0.15) * 0.6 : 1 - (lf - 0.15) * 0.45;
          p.el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) scale(" + sc.toFixed(3) + ")";
          p.el.style.opacity = (lf < 0.55 ? 1 : 1 - (lf - 0.55) / 0.45).toFixed(3);
        }

        // ring of icons
        const qx = QX - 960, qy = QY - 540;
        const orb = eSine(clamp01((t - 0.9) / 2.6));
        for (let i = 0; i < icons.length; i++) {
          const ic = icons[i];
          const u = clamp01((t - ic.s0) / 0.56);
          if (u <= 0) {
            ic.el.style.opacity = "0";
            continue;
          }
          // suction toward the « ? »: the icon whirls along the ring (never across the question) and dives in
          const su = clamp01((t - (3.48 + ic.k * 0.012)) / 0.38);
          const se = su > 0 ? eIn3(su) : 0;
          const th = ic.th0 + ORBIT * orb + (su > 0 ? ic.dq * eIn2(su) : 0);
          const p = ring(th);
          const burst = eBurst(u);
          let x = p.x * burst;
          let y = p.y * burst;
          let z = ZAMP * p.s * clamp01(burst);
          let sc = ePop(u);
          let op = clamp01(u * 5);
          let spin = 0;
          if (su > 0) {
            x = x + (qx - x) * se;
            y = y + (qy - y) * se;
            z = z * (1 - se);
            sc = sc * (1 - 0.8 * eIn2(su));
            spin = (ic.dq > 0 ? 1 : -1) * 160 * eIn2(su);
            op = op * (su > 0.85 ? 1 - (su - 0.85) / 0.15 : 1);
          }
          const breathe = 1 + 0.03 * Math.sin((t / 1.45) * Math.PI * 2 + ic.ph);
          const zf = (PERSP - z) / PERSP; // keep the projected path exactly on the ring
          const rotY = (1 - eOut3(u)) * 70 + 9 * p.c * (1 - se);
          ic.el.style.transform =
            "translate3d(" + (x * zf).toFixed(2) + "px," + (y * zf).toFixed(2) + "px," + z.toFixed(2) + "px) rotateY(" + rotY.toFixed(2) + "deg) rotate(" + spin.toFixed(2) + "deg) scale(" + (sc * breathe).toFixed(4) + ")";
          ic.el.style.opacity = op.toFixed(3);
          ic.el.style.zIndex = String(10 + Math.round(p.s * 9));
        }

        // seam A — bordeaux iris blooming out of the « ? », gold-rimmed
        const iu = clamp01((t - 3.55) / 0.4);
        const r = 2300 * eIn2(iu);
        iris.style.clipPath = "circle(" + (r > 0.5 ? r + 3 : 0).toFixed(1) + "px at " + QX + "px " + QY + "px)";
        rim.style.width = rim.style.height = (2 * (r + 3)).toFixed(1) + "px";
        rim.style.transform = "translate(" + (QX - r - 3).toFixed(1) + "px," + (QY - r - 3).toFixed(1) + "px)";
        rim.style.opacity = r > 1 && r < 1900 ? "1" : "0";
      };

      const drv = { t: 0 };
      tl.fromTo(drv, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: () => render(drv.t) }, 0);
      render(0);

      // ---------- the question, word by word on the voice ----------
      const words = Array.prototype.slice.call(textLayer.querySelectorAll(".acc-w"));
      // Envie de | relever le goût | de vos | plats du quotidien ?
      const WORD_AT = [0.45, 0.6, 0.75, 0.92, 1.06, 1.55, 1.75, 2.0, 2.2, 2.38, 2.84];
      words.forEach((w, i) => {
        tl.fromTo(
          w,
          { y: 40, scale: 0.9, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" },
          WORD_AT[i]
        );
      });
      // the « ? » gets a small settle-punch right before the iris blooms out of it
      tl.fromTo(qmark, { rotation: 0 }, { rotation: -8, duration: 0.22, ease: "power2.out" }, 3.28);
      tl.to(qmark, { rotation: 0, duration: 0.24, ease: "power2.inOut" }, 3.5);

      // ---------- the gold brushstroke under « relever le goût » ----------
      const trMain = $("trait-main");
      const trDry = $("trait-dry");
