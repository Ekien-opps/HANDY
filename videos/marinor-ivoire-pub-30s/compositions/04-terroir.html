  <script src="../assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var DUR = 4;
      var NS = "http://www.w3.org/2000/svg";
      var DEG = Math.PI / 180;
      var byId = function (id) {
        return document.getElementById(id);
      };
      var scope = document.querySelector('[data-composition-id="04-terroir"]') || document;
      var mk = function (tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      };
      var r1 = function (v) {
        return Math.round(v * 10) / 10;
      };
      var clamp01 = function (x) {
        return x < 0 ? 0 : x > 1 ? 1 : x;
      };
      var sineInOut = function (x) {
        return -(Math.cos(Math.PI * x) - 1) / 2;
      };
      var quadInOut = function (x) {
        return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
      };
      // deterministic LCG (no Math.random)
      var seed = 40412;
      var rnd = function () {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      var tl = gsap.timeline({ paused: true });

      /* ------------------------------------------------------------------
         Orbit geometry — tilted ellipse around the centre, upper arc = back
         ------------------------------------------------------------------ */
      var CX = 960,
        CY = 528,
        RX = 740,
        RY = 345,
        DELTA = 22; // degrees of clockwise travel during Scene 6

      var backStage = byId("f04-terroir-back");
      var frontStage = byId("f04-terroir-front");

      var items = [];
      Array.prototype.slice.call(scope.querySelectorAll(".f04-terroir-slot")).forEach(function (slot) {
        var size = Number(slot.getAttribute("data-size"));
        slot.style.width = size + "px";
        slot.style.height = size + "px";
        var o = Number(slot.getAttribute("data-order"));
        items.push({
          slot: slot,
          ent: slot.querySelector(".f04-terroir-ent"),
          bob: slot.querySelector(".f04-terroir-bob"),
          art: slot.querySelector(".f04-terroir-art"),
          a0: Number(slot.getAttribute("data-a0")),
          size: size,
          order: o,
          w: 2.5 + (o % 4) * 0.33,
          ph: o * 1.37,
          ay: 6 + (o % 3) * 1.6,
          ar: 2.2 + (o % 2) * 1.3,
        });
      });

      /* ------------------------------------------------------------------
         Gold dust (orbits for the whole shot) + front bokeh
         ------------------------------------------------------------------ */
      var dust = [];
      var addDust = function (parent, n, bokeh) {
        for (var k = 0; k < n; k++) {
          var el = document.createElement("div");
          el.className = bokeh ? "f04-terroir-bokeh" : "f04-terroir-dust";
          var s = bokeh ? 20 + rnd() * 22 : 4 + rnd() * 7;
          el.style.width = r1(s) + "px";
          el.style.height = r1(s) + "px";
          parent.appendChild(el);
          var rx = bokeh ? 640 + rnd() * 300 : 430 + rnd() * 520;
          dust.push({
            el: el,
            s: s,
            rx: rx,
            ry: rx * (0.4 + rnd() * 0.12),
            yo: (rnd() - 0.5) * (bokeh ? 60 : 150),
            th0: bokeh ? (0.18 + rnd() * 0.5) * Math.PI : rnd() * Math.PI * 2,
            w: bokeh ? 0.06 + rnd() * 0.08 : 0.1 + rnd() * 0.24,
            a: bokeh ? 0.3 + rnd() * 0.25 : 0.55 + rnd() * 0.45,
            tw: 3 + rnd() * 5,
            ph: rnd() * 6.28,
          });
        }
      };
      addDust(byId("f04-terroir-dust-back"), 52, false);
      addDust(byId("f04-terroir-dust-front"), 7, true);

      /* ------------------------------------------------------------------
         Leaves — background vegetation + dark blurred foreground corners
         ------------------------------------------------------------------ */
      var leafD = function (len, wid) {
        return "M0 0 C" + r1(len * 0.2) + " " + r1(-wid) + " " + r1(len * 0.68) + " " + r1(-wid * 0.92) + " " + r1(len) + " 0 C" + r1(len * 0.68) + " " + r1(wid * 0.92) + " " + r1(len * 0.2) + " " + r1(wid) + " 0 0Z";
      };
      var frond = function (parent, x0, y0, ang, len, bend, maxL, fill) {
        var g = mk("g", { fill: fill }, parent);
        var seg = 24,
          n = Math.round(len / seg),
          x = x0,
          y = y0,
          d = "M" + x0 + " " + y0;
        for (var i = 0; i < n; i++) {
          var u = i / n;
          var a = ang + bend * u;
          x += Math.cos(a * DEG) * seg;
          y += Math.sin(a * DEG) * seg;
          d += " L" + r1(x) + " " + r1(y);
          if (i < 1) continue;
          var L = maxL * (1 - 0.62 * u) * (0.86 + 0.28 * rnd());
          for (var sd = -1; sd <= 1; sd += 2) {
            var la = a + sd * (60 - 16 * u) + sd * 10 * (rnd() - 0.5);
            mk("path", { d: leafD(L, L * 0.12), transform: "translate(" + r1(x) + " " + r1(y) + ") rotate(" + r1(la) + ")" }, g);
          }
        }
        mk("path", { d: d, fill: "none", stroke: fill, "stroke-width": 8, "stroke-linecap": "round" }, g);
        return g;
      };
      var broad = function (parent, x0, y0, ang, len, wid, fill) {
        var g = mk("g", { transform: "translate(" + x0 + " " + y0 + ") rotate(" + ang + ")", fill: fill }, parent);
        mk("path", { d: leafD(len, wid) }, g);
        return g;
      };

      var bg = byId("f04-terroir-bgleaves-svg");
      frond(bg, -40, 360, -18, 520, 30, 120, "#22491a");
      frond(bg, 1960, 300, 200, 520, -26, 120, "#22491a");
      broad(bg, -30, 820, -24, 420, 90, "#204617");
      broad(bg, 1950, 860, 206, 440, 92, "#204617");
      broad(bg, 700, -40, 60, 300, 60, "#24501b");
      broad(bg, 1240, -50, 112, 320, 62, "#24501b");

      var fg = byId("f04-terroir-fg-svg");
      var FG_DARK = "#0c2108";
      var FG_MID = "#123010";
      var corners = [];
      var gTL = mk("g", {}, fg);
      frond(gTL, -70, -40, 30, 340, 24, 140, FG_DARK);
      broad(gTL, -60, 120, 8, 300, 62, FG_MID);
      corners.push({ g: gTL, ox: 0, oy: 0, amp: 1.6, w: 1.7, ph: 0.3, gust: 3.2 });
      var gTR = mk("g", {}, fg);
      broad(gTR, 1990, -30, 150, 420, 92, FG_DARK);
      broad(gTR, 1990, 140, 172, 300, 64, FG_MID);
      corners.push({ g: gTR, ox: 1920, oy: 0, amp: 1.3, w: 1.5, ph: 1.4, gust: -2.6 });
      var gBL = mk("g", {}, fg);
      broad(gBL, -40, 1110, -32, 440, 96, FG_DARK);
      frond(gBL, -60, 980, -6, 330, -14, 110, FG_MID);
      corners.push({ g: gBL, ox: 0, oy: 1080, amp: 1.4, w: 1.6, ph: 2.2, gust: -2.4 });
      var gBR = mk("g", {}, fg);
      frond(gBR, 1990, 1120, 212, 460, 22, 150, FG_DARK);
      broad(gBR, 1980, 960, 190, 280, 58, FG_MID);
      corners.push({ g: gBR, ox: 1920, oy: 1080, amp: 1.5, w: 1.4, ph: 3.1, gust: 2.8 });

      /* ------------------------------------------------------------------
         Procedural state — every value is a pure function of t (seek-safe)
         ------------------------------------------------------------------ */
      var glow = byId("f04-terroir-glow");
      var halo = byId("f04-terroir-halo");
      var ringBack = byId("f04-terroir-ring-back");
      var ringFront = byId("f04-terroir-ring-front");

      var tick = function (t) {
        // Scene 6 orbit progress (sine.inOut, 1.40 -> 3.55)
        var op = sineInOut(clamp01((t - 1.4) / 2.15));
        // Scene 7 rush (power3.in, 3.55 -> 4.00)
        var rk = clamp01((t - 3.55) / 0.45);
        var rush = rk * rk * rk;
        // stamp-impact shake of the orbit (decaying, from 1.52)
        var sx = 0,
          sy = 0;
        var sk = (t - 1.52) / 0.42;
        if (sk > 0 && sk < 1) {
          var amp = 11 * (1 - sk) * (1 - sk);
          sx = amp * Math.sin(sk * Math.PI * 2 * 3.2);
          sy = amp * 0.6 * Math.sin(sk * Math.PI * 2 * 4.1);
        }
        var stT = "translate(" + r1(sx) + "px," + r1(sy) + "px) scale(" + (1 + 2 * rush).toFixed(4) + ")";
        backStage.style.transform = stT;
        frontStage.style.transform = stT;

        // ingredients: orbit slot + depth + breathing
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var th = (it.a0 + op * DELTA) * DEG;
          var x = CX + RX * Math.cos(th);
          var y = CY + RY * Math.sin(th);
          var d = Math.sin(th);
          var s = 0.9 + 0.1 * d;
          it.slot.style.transform = "translate(" + r1(x - it.size / 2) + "px," + r1(y - it.size / 2) + "px) scale(" + s.toFixed(4) + ")";
          it.slot.style.zIndex = String(10 + Math.round((d + 1) * 20));
          var b = Math.max(0, -d) * 0.9 + 16 * rush;
          var br = 0.86 + 0.14 * ((d + 1) / 2);
          it.art.style.filter = "blur(" + b.toFixed(2) + "px) brightness(" + br.toFixed(3) + ")";
          var by = it.ay * Math.sin(t * it.w + it.ph);
          var rot = it.ar * Math.sin(t * it.w * 0.8 + it.ph * 1.3);
          var bs = 1 + 0.022 * Math.sin(t * it.w * 1.1 + it.ph * 0.7);
          it.bob.style.transform = "translateY(" + r1(by) + "px) rotate(" + rot.toFixed(2) + "deg) scale(" + bs.toFixed(4) + ")";
        }

        // gold dust
        var fade = clamp01((t - 0.05) / 0.5);
        for (var k = 0; k < dust.length; k++) {
          var p = dust[k];
          var a = p.th0 + p.w * t;
          var dx = CX + p.rx * Math.cos(a);
          var dy = CY + p.ry * Math.sin(a) + p.yo;
          var dsc = 0.7 + 0.3 * ((Math.sin(a) + 1) / 2);
          p.el.style.transform = "translate(" + r1(dx - p.s / 2) + "px," + r1(dy - p.s / 2) + "px) scale(" + dsc.toFixed(3) + ")";
          p.el.style.opacity = (p.a * (0.5 + 0.5 * Math.sin(t * p.tw + p.ph)) * fade).toFixed(3);
        }

        // orbit ring draw-on (0.35 -> 1.55): back arc over the top, then front arc under
        var rp = quadInOut(clamp01((t - 0.35) / 1.2));
        ringBack.setAttribute("stroke-dashoffset", (1 - clamp01(rp * 2)).toFixed(4));
        ringFront.setAttribute("stroke-dashoffset", (1 - clamp01(rp * 2 - 1)).toFixed(4));

        // ambient glow — blooms to its peak on the stamp settle (1.75), then breathes
        var gIn = 1 - Math.pow(1 - clamp01((t - 0.05) / 1.7), 2);
        var gb = Math.sin(((t - 1.75) / 2.8) * Math.PI * 2);
        glow.style.opacity = (0.62 + 0.33 * gIn + (t > 1.75 ? 0.05 * gb : 0)).toFixed(3);
        glow.style.transform = "scale(" + (0.94 + 0.06 * gIn + (t > 1.75 ? 0.02 * gb : 0) + 0.25 * rush).toFixed(4) + ")";
        halo.style.transform = "scale(" + (1 + 0.025 * Math.sin(t * 2.2) + 0.4 * rush).toFixed(4) + ")";

        // foreground leaves: gust on the "souffle vegetal" (0.2 s) + idle sway + push-out on the rush
        var gu = clamp01((t - 0.12) / 1.3);
        var gust = Math.sin(gu * Math.PI) * (1 - 0.4 * gu);
        var push = 1 + 0.55 * rush;
        for (var c = 0; c < corners.length; c++) {
          var cr = corners[c];
          var ang = cr.gust * gust + cr.amp * Math.sin(t * cr.w + cr.ph);
          cr.g.setAttribute("transform", "translate(960 540) scale(" + push.toFixed(4) + ") translate(-960 -540) rotate(" + ang.toFixed(3) + " " + cr.ox + " " + cr.oy + ")");
        }
      };

      /* ------------------------------------------------------------------
         Scene 1 — seam C entry: full-frame cream lifts away upward
         ------------------------------------------------------------------ */
      tl.fromTo(byId("f04-terroir-veil"), { y: 0 }, { y: -1518, duration: 0.5, ease: "power2.inOut" }, 0);

      /* ------------------------------------------------------------------
         Scene 2 — depth-scatter-assemble: ingredients surge from depth
         ------------------------------------------------------------------ */
      var GOLDEN = Math.PI * (3 - Math.sqrt(5));
      items.forEach(function (it) {
        var i = it.order;
        var a = i * GOLDEN;
        var at = 0.15 + i * 0.07;
        tl.fromTo(
          it.ent,
          { x: Math.cos(a) * 140, y: Math.sin(a) * 90, z: -900, rotationX: Math.sin(a) * 62, rotationY: Math.cos(a) * 62, rotationZ: -22 },
          { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, rotationZ: 0, duration: 0.9, ease: "power3.out" },
          at,
        );
        tl.fromTo(it.ent, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
      });

      /* ------------------------------------------------------------------
         Scene 3 — physics-press: the stamp prints itself (1.40 -> 1.75)
         ------------------------------------------------------------------ */
      var stamp = byId("f04-terroir-stamp");
      var stampShadow = byId("f04-terroir-stamp-shadow");
      var ripple = byId("f04-terroir-ripple");
      tl.fromTo(stamp, { scale: 1.6, rotation: -20 }, { scale: 0.92, rotation: -8, duration: 0.12, ease: "power2.in" }, 1.4);
      tl.fromTo(stamp, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "none" }, 1.4);
      tl.to(stamp, { scale: 1, duration: 0.34, ease: "back.out(2.4)" }, 1.52);
      tl.fromTo(stampShadow, { opacity: 0, scale: 1.45, x: 18, y: 36 }, { opacity: 0.75, scale: 0.94, x: 0, y: 4, duration: 0.12, ease: "power2.in" }, 1.4);
      tl.to(stampShadow, { opacity: 0.55, scale: 1, y: 0, duration: 0.34, ease: "power2.out" }, 1.52);
      tl.fromTo(ripple, { scale: 0.96, rotation: -8 }, { scale: 1.6, duration: 0.6, ease: "power2.out" }, 1.52);
      tl.fromTo(ripple, { opacity: 0 }, { opacity: 0.75, duration: 0.03, ease: "none" }, 1.52);
      tl.to(ripple, { opacity: 0, duration: 0.55, ease: "power1.out" }, 1.56);

      /* ------------------------------------------------------------------
         Scene 4 — title words on "cent pour cent naturelles"
         ------------------------------------------------------------------ */
      [
        ["f04-terroir-w1", 1.45],
        ["f04-terroir-w2", 1.74],
        ["f04-terroir-w3", 2.06],
      ].forEach(function (w) {
        tl.fromTo(byId(w[0]), { y: 62, opacity: 0, scale: 0.94, filter: "blur(10px)" }, { y: 0, opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.62, ease: "power3.out" }, w[1]);
      });
      // ambient-glow-bloom halo behind the cluster — lands with the title settle
      tl.fromTo(halo, { opacity: 0 }, { opacity: 0.42, duration: 1.1, ease: "power2.out" }, 1.5);

      /* ------------------------------------------------------------------
         Scene 5 — "de Côte d'Ivoire" + tricolour filet draws left -> right
         ------------------------------------------------------------------ */
      [
        ["f04-terroir-s1", 2.82],
        ["f04-terroir-s2", 2.9],
        ["f04-terroir-s3", 2.99],
      ].forEach(function (w) {
        tl.fromTo(byId(w[0]), { y: 40, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, w[1]);
      });
      tl.fromTo(byId("f04-terroir-filet"), { scaleX: 0 }, { scaleX: 1, duration: 0.52, ease: "power2.inOut" }, 2.98);
      var glint = byId("f04-terroir-glint");
      tl.fromTo(glint, { scale: 0, rotation: -60, opacity: 0 }, { scale: 1.1, rotation: 0, opacity: 1, duration: 0.2, ease: "back.out(2)" }, 3.42);
      tl.to(glint, { scale: 0.4, rotation: 35, opacity: 0, duration: 0.28, ease: "power2.in" }, 3.64);

      /* ------------------------------------------------------------------
         Scene 7 — seam D: ingredients rush the lens, warm light floods the frame
         ------------------------------------------------------------------ */
      var typecam = byId("f04-terroir-typecam");
      tl.fromTo(typecam, { scale: 1 }, { scale: 1.12, duration: 0.45, ease: "power2.in" }, 3.55);
      // "montee lumineuse" (3.5 s): a warm screen-blended flare swells first, lighting the scene...
      var flare = byId("f04-terroir-flare");
      tl.fromTo(flare, { scale: 0.3, opacity: 0 }, { scale: 3.4, opacity: 1, duration: 0.45, ease: "power2.in" }, 3.45);
      // ...then the #FBD021 -> #FFF3D6 light blooms from the centre and covers the frame by 3.95 s
      var bloom = byId("f04-terroir-bloom");
      tl.fromTo(bloom, { scale: 0.04 }, { scale: 5.6, duration: 0.4, ease: "power3.in" }, 3.55);
      // a point of light that ignites fast and stays opaque: partial-alpha cream over green reads khaki,
      // so the transparency lives only in the saturated gold rim of the gradient
      tl.fromTo(bloom, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 3.56);
      // the bloom sits BEHIND the type: seal + title read backlit, then burn out in the light
      tl.fromTo(typecam, { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power1.in" }, 3.76);
      // a second disc of the same light, above everything, swallows the rushing ingredients + corner leaves
      var cover = byId("f04-terroir-cover");
      tl.fromTo(cover, { scale: 2.2 }, { scale: 5.6, duration: 0.13, ease: "power2.in" }, 3.82);
      tl.fromTo(cover, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power1.in" }, 3.82);
      var solid = byId("f04-terroir-solid");
      gsap.set(solid, { opacity: 0 });
      tl.set(solid, { opacity: 1 }, 3.95);

      /* ------------------------------------------------------------------
         Master clock — drives orbit, depth, breathing, dust, ring, leaves
         ------------------------------------------------------------------ */
      var clock = { t: 0 };
      tick(0);
      tl.fromTo(
        clock,
        { t: 0 },
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            tick(clock.t);
          },
        },
        0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-terroir"] = tl;
    })();
  </script>
</template>
