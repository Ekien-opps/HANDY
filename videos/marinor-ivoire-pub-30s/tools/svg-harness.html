<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"/>
<style>
@font-face{font-family:"Cream Heavy";src:url("../assets/fonts/Cream-Heavy.ttf") format("truetype");font-weight:900;}
@font-face{font-family:"Montserrat";src:url("../assets/fonts/Montserrat-latin.woff2") format("woff2");font-weight:100 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:"Montserrat";src:url("../assets/fonts/Montserrat-latin-ext.woff2") format("woff2");font-weight:100 900;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
</style></head>
<body><div id="stage"></div>
<script>
window.__timelines = {};
window.__hfLoadScene = async function (id) {
  const html = await (await fetch("../compositions/" + id + ".html")).text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const tpl = doc.querySelector("template");
  const frag = tpl ? tpl.content : doc.body;
  const stage = document.getElementById("stage");
  const scripts = [];
  for (const node of Array.from(frag.childNodes)) {
    if (node.nodeName === "SCRIPT") { scripts.push(node); continue; }
    stage.appendChild(document.importNode(node, true));
  }
  // scripts nested inside markup too
  stage.querySelectorAll("script").forEach(s => { scripts.push(s); s.remove(); });
  for (const s of scripts) {
    await new Promise((res, rej) => {
      const n = document.createElement("script");
      if (s.src || s.getAttribute("src")) { n.src = s.getAttribute("src"); n.onload = res; n.onerror = rej; document.body.appendChild(n); }
      else { n.textContent = s.textContent; document.body.appendChild(n); res(); }
    });
  }
  await document.fonts.ready;
  await Promise.all(Array.from(document.images).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  return Object.keys(window.__timelines);
};
window.__hfSeek = function (id, t) {
  const tl = window.__timelines[id];
  tl.seek(0, false); tl.seek(t, false);
  // emulate HyperFrames clip windows
  document.querySelectorAll("#stage [data-start]").forEach(el => {
    const s = parseFloat(el.getAttribute("data-start")) || 0;
    const d = parseFloat(el.getAttribute("data-duration"));
    const on = t >= s && (isNaN(d) || t < s + d);
    if (!on) el.style.display = "none";
  });
};
</script></body></html>
